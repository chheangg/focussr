name: Release

# Pushing a tag like v0.1.0 builds every platform and uploads to a draft release.
# Nothing is public until the draft is published on GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          FOCUSSR_UNIVERSAL: '1'
      # GitHub's download server sometimes times out while fetching Electron.
      - name: Package and upload
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            npx electron-builder --publish always && exit 0
            echo "Packaging failed on attempt $attempt. Retrying..."
            sleep $((attempt * 30))
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
